# ==============================================================
# Docker Compose configuration for TastyBite
# Run the whole project locally with: docker compose up --build
# ==============================================================

services:
  web:
    build: .
    container_name: tastybite_web
    command: sh -c "python manage.py migrate && gunicorn restaurant_system.wsgi:application --bind 0.0.0.0:1011 --workers 3"
    volumes:
      # Mount the code so local changes reflect without rebuilding the image
      - .:/app
      # Persist the SQLite database file outside the container
      - sqlite_data:/app/data
      # Directly bind-mount the host's media folder (not a Docker-managed volume)
      # so uploaded/transferred images are immediately visible to the container
      - ./media:/app/media
    ports:
      - "1011:1011"
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-change-this-key-in-production-1234567890
      - RENDER_EXTERNAL_HOSTNAME=
    env_file:
      - .env

volumes:
  sqlite_data: